version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unparam
    - revive
    - funlen
    - gocritic
    - misspell
    - nakedret
    - lll
    - cyclop
    - dupl
    - exhaustive
    - gosec
    - errorlint
    - modernize
    - depguard
    - bodyclose
    - containedctx
    - errname
    - forcetypeassert
    - gochecknoinits
    - gochecknoglobals
    - interfacebloat
    - nilnil
    - predeclared
    - usestdlibvars
  settings:
    funlen:
      lines: 40
      statements: 40
    lll:
      line-length: 100
    cyclop:
      max-complexity: 8
    dupl:
      threshold: 100
    interfacebloat:
      max: 10
    depguard:
      rules:
        dominio:
          files:
            - "**/internal/domain/**"
          allow:
            - $gostd
            - teachers/goteacher/internal/domain
        dominio-sin-sql:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: database/sql
              desc: el dominio no accede a la base de datos
        adaptadores:
          files:
            - "**/internal/adapters/**"
          deny:
            - pkg: teachers/goteacher/internal/app
              desc: el adaptador implementa un puerto, no llama casos de uso
        web:
          files:
            - "**/internal/web/**"
          deny:
            - pkg: teachers/goteacher/internal/adapters
              desc: la frontera web no conoce adaptadores de salida
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: argument-limit
          arguments: [4]
        - name: cognitive-complexity
          arguments: [8]
        - name: unused-parameter
        - name: early-return
        - name: comment-spacings
        - name: context-as-argument
        - name: package-comments
        - name: superfluous-else
        - name: unexported-return
  exclusions:
    rules:
      - linters:
          - gochecknoglobals
        text: "^Err[A-Z]"
      - path: _test\.go
        linters:
          - depguard
          - funlen
          - lll
          - cyclop
          - errcheck

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(teachers/goteacher)
