version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unparam
    - revive
    - funlen
    - gocritic
    - misspell
    - nakedret
    - lll
    - cyclop
    - dupl
    - exhaustive
    - gosec
    - errorlint
    - modernize
    - depguard
    - bodyclose
    - containedctx
    - contextcheck
    - errname
    - forcetypeassert
    - gochecknoinits
    - gochecknoglobals
    - interfacebloat
    - nilerr
    - nilnil
    - noctx
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - usestdlibvars
    - err113
    - musttag
    - ireturn
    - maintidx
    - gocognit
    - forbidigo
    - nolintlint
  settings:
    err113:
      check-error-free-returns: false
    ireturn:
      allow:
        - error
        - empty
        - generic
        - stdlib
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: usa un logger estructurado
    nolintlint:
      require-explanation: true
      require-specific: true
    funlen:
      lines: 40
      statements: 40
    lll:
      line-length: 100
    cyclop:
      max-complexity: 8
    gocognit:
      min-complexity: 15
    maintidx:
      under: 20
    dupl:
      threshold: 100
    interfacebloat:
      max: 10
    depguard:
      rules:
        dominio:
          files:
            - "**/internal/domain/**"
          allow:
            - $gostd
            - teachers/goteacher/internal/domain
        dominio-sin-sql:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: database/sql
              desc: el dominio no accede a la base de datos
        adaptadores:
          files:
            - "**/internal/adapters/**"
          deny:
            - pkg: teachers/goteacher/internal/app
              desc: el adaptador implementa un puerto, no llama casos de uso
        web:
          files:
            - "**/internal/web/**"
          deny:
            - pkg: teachers/goteacher/internal/adapters
              desc: la frontera web no conoce adaptadores de salida
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: argument-limit
          arguments: [4]
        - name: cognitive-complexity
          arguments: [8]
        - name: unused-parameter
        - name: early-return
        - name: comment-spacings
        - name: context-as-argument
        - name: package-comments
        - name: superfluous-else
        - name: unexported-return
  exclusions:
    rules:
      - linters:
          - gochecknoglobals
        text: "^Err[A-Z]"
      - path: _test\.go
        linters:
          - depguard
          - funlen
          - lll
          - cyclop
          - errcheck
          - err113
          - wrapcheck
      # Composition root: unico lugar que conoce todas las capas y arma el error final.
      - path: cmd/api/main\.go
        linters:
          - wrapcheck
          - err113
      # Repositorio en memoria didactico: devuelve el error del dominio tal cual.
      - path: internal/adapters/memory/
        linters:
          - wrapcheck

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(teachers/goteacher)
