version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unparam
    - revive
    - funlen
    - gocritic
    - misspell
    - nakedret
    - lll
    - cyclop
    - dupl
    - gosec
    - errorlint
    - modernize
    - depguard
  settings:
    funlen:
      lines: 40
      statements: 40
    lll:
      line-length: 100
    cyclop:
      max-complexity: 8
    dupl:
      threshold: 100
    depguard:
      rules:
        dominio:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: teachers/goteacher/internal/app
              desc: el dominio no conoce los casos de uso
            - pkg: teachers/goteacher/internal/adapters
              desc: el dominio no conoce los adaptadores
        adaptadores:
          files:
            - "**/internal/adapters/**"
          deny:
            - pkg: teachers/goteacher/internal/app
              desc: el adaptador implementa un puerto, no llama casos de uso
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: argument-limit
          arguments: [4]
        - name: cognitive-complexity
          arguments: [8]
        - name: unused-parameter
        - name: early-return
        - name: comment-spacings
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - lll
          - cyclop
          - errcheck

formatters:
  enable:
    - gofmt
