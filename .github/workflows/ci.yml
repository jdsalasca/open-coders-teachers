name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions fijadas por SHA: un tag movible es un vector de supply-chain.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Herramientas Python
        run: pip install ruff mypy import-linter pytest pytest-cov pip-audit semgrep

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            typescript-teacher/package-lock.json
            React-teacher/package-lock.json

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Dependencias Node
        run: |
          npm ci --no-fund --no-audit --prefix typescript-teacher
          npm ci --no-fund --no-audit --prefix React-teacher

      - name: Escaneres y govulncheck
        run: |
          curl -sSfL -o golangci-lint.tar.gz \
            https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz
          tar -xzf golangci-lint.tar.gz
          sudo install golangci-lint-2.15.0-linux-amd64/golangci-lint /usr/local/bin/golangci-lint
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo install gitleaks /usr/local/bin/gitleaks
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Autochequeo del runner
        run: python tools/test_lint.py

      - name: Lint, capas y tests
        run: python tools/lint.py

      - name: Vulnerabilidades en dependencias
        run: python tools/lint.py --audit

      - name: Secretos y patrones inseguros
        run: python tools/lint.py --security
