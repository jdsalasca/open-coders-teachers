name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Herramientas Python
        run: pip install ruff mypy import-linter pytest pytest-cov pip-audit

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            typescript-teacher/package-lock.json
            React-teacher/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Dependencias Node
        run: |
          npm ci --no-fund --no-audit --prefix typescript-teacher
          npm ci --no-fund --no-audit --prefix React-teacher

      - name: golangci-lint y govulncheck
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v2.15.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Autochequeo del runner
        run: python tools/test_lint.py

      - name: Lint, capas y tests
        run: python tools/lint.py

      - name: Vulnerabilidades en dependencias
        run: python tools/lint.py --audit
