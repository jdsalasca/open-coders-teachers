name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions fijadas por SHA: un tag movible es un vector de supply-chain.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Herramientas Python
        run: pip install ruff==0.16.10 mypy==2.4.0 import-linter==2.16 pytest==8.4.1 pytest-cov==6.2.1 hypothesis==6.170.15 pip-audit==2.10.1 semgrep==1.179.0 diff-cover==11.0.3

      - name: Dependencias Python bloqueadas
        run: pip install --require-hashes -r python-teacher/requirements.lock

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            typescript-teacher/package-lock.json
            React-teacher/package-lock.json
            tools/node/package-lock.json

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-16
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cobertura Rust
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Dependencias vulnerables (PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

      - name: SBOM (informativo)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json

      - name: Dependencias Node
        run: |
          npm ci --no-fund --no-audit --prefix typescript-teacher
          npm ci --no-fund --no-audit --prefix React-teacher
          npm ci --no-fund --no-audit --prefix tools/node

      - name: Build TypeScript
        run: npm run build --prefix typescript-teacher

      - name: Presupuesto de bundle (React)
        run: npm run size --prefix React-teacher

      - name: E2E y accesibilidad (React)
        run: |
          cd React-teacher
          npx playwright install --with-deps chromium
          npm run e2e

      - name: E2E y accesibilidad (TypeScript)
        run: npm run e2e --prefix typescript-teacher

      - name: Escaneres y govulncheck
        run: |
          # Los binarios se instalan desde $RUNNER_TEMP: si se descomprimen en el
          # repo, gitleaks escanea su propio README (falsos positivos).
          cd "$RUNNER_TEMP"
          curl -sSfL -o golangci-lint-2.15.0-linux-amd64.tar.gz \
            https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz
          curl -sSfL -o golangci-checksums.txt \
            https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-checksums.txt
          grep " golangci-lint-2.15.0-linux-amd64.tar.gz$" golangci-checksums.txt | sha256sum -c -
          tar -xzf golangci-lint-2.15.0-linux-amd64.tar.gz
          sudo install golangci-lint-2.15.0-linux-amd64/golangci-lint /usr/local/bin/golangci-lint
          curl -sSfL -o gitleaks_8.30.1_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o gitleaks-checksums.txt \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep " gitleaks_8.30.1_linux_x64.tar.gz$" gitleaks-checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          sudo install gitleaks /usr/local/bin/gitleaks
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Autochequeo del runner
        run: python tools/test_lint.py

      - name: ADR para cambios de arquitectura
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/check_adr.py "origin/$BASE_REF"

      - name: Secretos y patrones inseguros
        env:
          LINT_SKIP_DEPENDABOT: "1"
        run: python tools/lint.py --security

      - name: Secretos en el historial
        run: gitleaks detect --source . --redact --no-banner -v

      - name: Lint, capas y tests
        run: python tools/lint.py

      - name: Cobertura por archivo
        run: python tools/coverage_gate.py

      - name: Cobertura de lineas nuevas
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          diff-cover python-teacher/coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=80
          diff-cover Java-teacher/target/site/jacoco/jacoco.xml \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=80
          diff-cover \
            typescript-teacher/coverage/lcov.info \
            React-teacher/coverage/lcov.info \
            Rust-teacher/target/lcov.info \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=80

      - name: Publicar cobertura
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: coverage
          path: |
            python-teacher/coverage.xml
            go-teacher/coverage.html
            React-teacher/coverage
            typescript-teacher/coverage
            Java-teacher/target/site/jacoco
          if-no-files-found: warn


  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Herramientas Python
        run: pip install ruff==0.16.10 mypy==2.4.0 import-linter==2.16 pytest==8.4.1 pytest-cov==6.2.1 hypothesis==6.170.15 semgrep==1.179.0

      - name: Dependencias Python bloqueadas
        run: pip install --require-hashes -r python-teacher/requirements.lock

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            typescript-teacher/package-lock.json
            React-teacher/package-lock.json
            tools/node/package-lock.json

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-16
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cobertura Rust
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Dependencias vulnerables (PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

      - name: Dependencias Node
        run: |
          npm ci --no-fund --no-audit --prefix typescript-teacher
          npm ci --no-fund --no-audit --prefix React-teacher
          npm ci --no-fund --no-audit --prefix tools/node

      - name: golangci-lint
        shell: pwsh
        run: |
          curl.exe -sSfL -o "$env:RUNNER_TEMP\golangci.zip" `
            https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-windows-amd64.zip
          curl.exe -sSfL -o "$env:RUNNER_TEMP\golangci-checksums.txt" `
            https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-checksums.txt
          $expected = (Select-String -Path "$env:RUNNER_TEMP\golangci-checksums.txt" `
            -Pattern ' golangci-lint-2.15.0-windows-amd64.zip$').Line.Split(' ')[0]
          $actual = (Get-FileHash "$env:RUNNER_TEMP\golangci.zip" -Algorithm SHA256).Hash.ToLower()
          if (-not $expected -or $actual -ne $expected) { throw "checksum invalido de golangci-lint" }
          Expand-Archive "$env:RUNNER_TEMP\golangci.zip" -DestinationPath "$env:RUNNER_TEMP\golangci"
          $bin = Get-ChildItem "$env:RUNNER_TEMP\golangci" -Recurse -Filter golangci-lint.exe |
            Select-Object -First 1
          $bin.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: actionlint
        shell: pwsh
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Autochequeo del runner
        run: python tools/test_lint.py

      - name: Lint, capas y tests
        run: python tools/lint.py

      - name: Cobertura por archivo
        run: python tools/coverage_gate.py
