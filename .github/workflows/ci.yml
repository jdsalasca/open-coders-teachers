name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      # Actions fijadas por SHA: un tag movible es un vector de supply-chain.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Herramientas Python
        run: pip install ruff mypy import-linter pytest pytest-cov hypothesis pip-audit semgrep

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            typescript-teacher/package-lock.json
            React-teacher/package-lock.json
            tools/node/package-lock.json

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Dependencias Node
        run: |
          npm ci --no-fund --no-audit --prefix typescript-teacher
          npm ci --no-fund --no-audit --prefix React-teacher
          npm ci --no-fund --no-audit --prefix tools/node

      - name: Presupuesto de bundle (React)
        run: npm run size --prefix React-teacher

      - name: E2E y accesibilidad (React)
        run: |
          cd React-teacher
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Escaneres y govulncheck
        run: |
          # Los binarios se instalan desde $RUNNER_TEMP: si se descomprimen en el
          # repo, gitleaks escanea su propio README (falsos positivos).
          curl -sSfL -o "$RUNNER_TEMP/golangci.tar.gz" \
            https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/golangci.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/golangci-lint-2.15.0-linux-amd64/golangci-lint" /usr/local/bin/golangci-lint
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Autochequeo del runner
        run: python tools/test_lint.py

      - name: ADR para cambios de arquitectura
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/check_adr.py "origin/$BASE_REF"

      - name: Secretos y patrones inseguros
        run: python tools/lint.py --security

      - name: Lint, capas y tests
        run: python tools/lint.py

      - name: Publicar cobertura
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: coverage
          path: |
            python-teacher/coverage.xml
            go-teacher/coverage.html
            React-teacher/coverage
            typescript-teacher/coverage
            Java-teacher/target/site/jacoco
          if-no-files-found: warn

      - name: Vulnerabilidades en dependencias
        run: python tools/lint.py --audit

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Herramientas Python
        run: pip install ruff mypy import-linter pytest pytest-cov hypothesis

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            typescript-teacher/package-lock.json
            React-teacher/package-lock.json
            tools/node/package-lock.json

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27"
          cache: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Dependencias Node
        run: |
          npm ci --no-fund --no-audit --prefix typescript-teacher
          npm ci --no-fund --no-audit --prefix React-teacher
          npm ci --no-fund --no-audit --prefix tools/node

      - name: golangci-lint
        shell: pwsh
        run: |
          curl.exe -sSfL -o "$env:RUNNER_TEMP\golangci.zip" `
            https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-windows-amd64.zip
          Expand-Archive "$env:RUNNER_TEMP\golangci.zip" -DestinationPath "$env:RUNNER_TEMP\golangci"
          $bin = Get-ChildItem "$env:RUNNER_TEMP\golangci" -Recurse -Filter golangci-lint.exe |
            Select-Object -First 1
          $bin.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Autochequeo del runner
        run: python tools/test_lint.py

      - name: Lint, capas y tests
        run: python tools/lint.py
