name: mutation

on:
  schedule:
    - cron: "0 7 * * 1"
  pull_request:
    paths:
      - "typescript-teacher/**"
      - "React-teacher/**"
      - "Java-teacher/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            typescript-teacher/package-lock.json
            React-teacher/package-lock.json

      - name: Dependencias
        run: |
          npm ci --no-fund --no-audit --prefix typescript-teacher
          npm ci --no-fund --no-audit --prefix React-teacher

      - name: Mutantes TypeScript
        run: npm run mutation --prefix typescript-teacher

      - name: Mutantes React
        run: npm run mutation --prefix React-teacher

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Mutantes Java (PIT)
        working-directory: Java-teacher
        run: mvn -q -B test-compile pitest:mutationCoverage
