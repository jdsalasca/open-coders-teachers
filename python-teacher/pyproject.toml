[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle: formato e indentacion
  "W",   # pycodestyle: warnings
  "F",   # pyflakes: imports/variables sin usar
  "I",   # isort: orden de imports
  "N",   # pep8-naming
  "D",   # pydocstyle: documentacion
  "ARG", # argumentos sin usar
  "PLR", # pylint refactor: tamano, parametros, complejidad
  "C90", # mccabe
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # reglas propias de ruff
  "S",   # bandit: seguridad (eval, subprocess, secretos)
  "PT",  # estilo de pytest en tests
  "A",   # no sombrear builtins (id, list, type...)
  "RET", # salidas innecesarias: else tras return, asignar y retornar
]
ignore = [
  "D100",     # docstring de modulo: no aporta en scripts de clase
  "D203",     # conflicto con D211
  "D213",     # conflicto con D212
  "PLR2004",  # numeros magicos: normal en ejemplos didacticos
  "RUF001",   # caracteres unicode ambiguos (tildes en espanol)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.pylint]
max-args = 4
max-positional-args = 4
max-branches = 10
max-returns = 6
max-statements = 40

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103", "PLR0913", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Hexagonal: el dominio no conoce application ni infrastructure"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.application", "app.infrastructure"]

[[tool.importlinter.contracts]]
name = "Hexagonal: infrastructure -> application -> domain"
type = "layers"
layers = ["app.infrastructure", "app.application", "app.domain"]
